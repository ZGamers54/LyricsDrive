name: EeveeLyricsBridge
options:
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""

targets:
  zxPluginsInject:
    type: dynamicLibrary
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: EeveeBridge/Bridge
    settings:
      base:
        PRODUCT_NAME: zxPluginsInject
        EXECUTABLE_PREFIX: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.zgamers54.eeveelyrics.bridge
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        CODE_SIGNING_ALLOWED: NO
        MACH_O_TYPE: mh_dylib
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        OTHER_LDFLAGS: "$(inherited) -framework Foundation -framework MediaPlayer -framework WidgetKit -framework Network"

  LyricsDriveWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: EeveeBridge/Widget
    settings:
      base:
        PRODUCT_NAME: WidgetExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.spotify.client.widgetnowplaying
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGNING_ALLOWED: NO
    info:
      path: EeveeBridge/Widget/Info.plist
      properties:
        CFBundleDisplayName: LyricsDrive
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: "9.0.98"
        CFBundleVersion: "909801187"
        MinimumOSVersion: "17.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  EeveeLyricsBridge:
    build:
      targets:
        zxPluginsInject: all
        LyricsDriveWidgetExtension: all
    archive:
      config: Release
