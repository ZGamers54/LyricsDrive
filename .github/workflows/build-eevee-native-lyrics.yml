name: Build Eevee Native Lyrics Bridge

on:
  pull_request:
    branches: [main]
    paths:
      - 'EeveeBridge/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  SWIFTPROTOBUF_VERSION: "1.29.0"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout LyricsDrive
        uses: actions/checkout@v4

      - name: Checkout matching EeveeSpotify source
        uses: actions/checkout@v4
        with:
          repository: Uzz1311/SpotifyPremium
          ref: swift
          path: EeveeBridge/vendor-eevee

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid xcodegen
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install SwiftProtobuf for EeveeSpotify
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/swiftprotobuf"
          cd "$RUNNER_TEMP/swiftprotobuf"
          curl -fL -o swiftprotobuf.deb             "https://github.com/whoeevee/swift-protobuf/releases/download/${SWIFTPROTOBUF_VERSION}/org.swift.protobuf.swiftprotobuf_${SWIFTPROTOBUF_VERSION}_iphoneos-arm.deb"
          ar -x swiftprotobuf.deb
          tar -xf data.tar.lzma
          cp -R Library/Frameworks/SwiftProtobuf.framework "$THEOS/lib/"

      - name: Patch EeveeSpotify native lyrics handoff
        run: |
          python3 EeveeBridge/patch-eevee-native-lyrics.py EeveeBridge/vendor-eevee
          grep -n "LyricsDrive.EeveeLyricsLoaded"             EeveeBridge/vendor-eevee/Sources/EeveeSpotify/Lyrics/CustomLyrics.x.swift

      - name: Build patched EeveeSpotify dylib
        working-directory: EeveeBridge/vendor-eevee
        run: |
          set -o pipefail
          make clean || true
          make package FINALPACKAGE=1 | tee ../eevee-build.log
          DEB="$(find packages -name '*.deb' -type f | head -n 1)"
          test -n "$DEB"
          mkdir -p ../eevee-extract
          dpkg-deb -x "$DEB" ../eevee-extract
          DYLIB="$(find ../eevee-extract -name 'EeveeSpotify.dylib' -type f | head -n 1)"
          test -n "$DYLIB"
          cp "$DYLIB" ../EeveeSpotify.dylib
          strings ../EeveeSpotify.dylib | grep -F "LyricsDrive.EeveeLyricsLoaded"

      - name: Build LyricsDrive bridge dylib
        working-directory: EeveeBridge
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build/bridge

          xcrun --sdk iphoneos clang             -target arm64-apple-ios26.0             -isysroot "$SDK"             -fobjc-arc             -c Bridge/Bootstrap.m             -o build/bridge/Bootstrap.o

          xcrun --sdk iphoneos swiftc             -target arm64-apple-ios26.0             -sdk "$SDK"             -parse-as-library             -emit-library             Bridge/LyricsDriveBridge.swift             build/bridge/Bootstrap.o             -o build/bridge/zxPluginsInject.dylib             -Xlinker -install_name             -Xlinker @rpath/zxPluginsInject.dylib             -framework Foundation             -framework MediaPlayer             -framework WidgetKit             -framework Network             -framework ActivityKit             -framework UIKit

      - name: Generate widget project
        working-directory: EeveeBridge
        run: xcodegen generate

      - name: Build LyricsDrive widget
        working-directory: EeveeBridge
        run: |
          set -o pipefail
          xcodebuild             -project EeveeLyricsBridge.xcodeproj             -scheme EeveeLyricsWidget             -configuration Release             -sdk iphoneos             -derivedDataPath build/widget             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             clean build | tee xcodebuild.log

      - name: Collect native bridge payload
        working-directory: EeveeBridge
        run: |
          set -eux
          rm -rf native-artifact
          mkdir -p native-artifact

          cp EeveeSpotify.dylib native-artifact/EeveeSpotify.dylib
          cp build/bridge/zxPluginsInject.dylib native-artifact/zxPluginsInject.dylib

          WIDGET="$(find build/widget/Build/Products/Release-iphoneos -maxdepth 1 -type d -name 'WidgetExtension.appex' -print -quit)"
          test -n "$WIDGET"
          cp -R "$WIDGET" native-artifact/WidgetExtension.appex

          file native-artifact/EeveeSpotify.dylib
          file native-artifact/zxPluginsInject.dylib
          plutil -p native-artifact/WidgetExtension.appex/Info.plist

      - name: Upload native bridge payload
        uses: actions/upload-artifact@v4
        with:
          name: EeveeLyricsNative-patch
          path: EeveeBridge/native-artifact
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: EeveeLyricsNative-build-logs
          path: |
            EeveeBridge/eevee-build.log
            EeveeBridge/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
